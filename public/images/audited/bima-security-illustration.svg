    <path d="M329 485L480 425L631 485V525L480 588L329 525V485Z" fill="url(#platformTop)" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M358 463L480 414L602 463V493L480 542L358 493V463Z" fill="#FFF9F6" stroke="#FFE6DA" stroke-width="2"/>
    <ellipse cx="480" cy="474" rx="87" ry="34" fill="#FFF1E9" stroke="#FFB18B" stroke-width="2"/>
