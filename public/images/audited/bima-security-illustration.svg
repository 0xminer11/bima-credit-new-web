<svg width="960" height="720" viewBox="0 0 960 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldFill" x1="480" y1="175" x2="480" y2="510" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7F2" stop-opacity="0.98"/>
      <stop offset="0.55" stop-color="#FFE5D8" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#FFC6A9" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="shieldEdge" x1="352" y1="185" x2="609" y2="501" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.38" stop-color="#FFB58F"/>
      <stop offset="0.72" stop-color="#FF6A28"/>
      <stop offset="1" stop-color="#FF5001"/>
    </linearGradient>
    <linearGradient id="platformTop" x1="250" y1="440" x2="698" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#FFF2EB" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="cube" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFD7C4" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="nodeOrange" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFB77C"/>
      <stop offset="1" stop-color="#FF5001"/>
    </linearGradient>
    <linearGradient id="nodeBlue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#CBD5FF"/>
      <stop offset="1" stop-color="#8EA0FF"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(500 348) rotate(90) scale(290 340)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFEEE5" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#FFF8F4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#C95A26" flood-opacity="0.15"/>
    </filter>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#472111" flood-opacity="0.10"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.8" fill="#FF8E58" fill-opacity="0.18"/>
    </pattern>
    <clipPath id="shieldClip">
      <path d="M480 180C423 203 382 220 344 229V339C344 425 401 487 480 526C559 487 616 425 616 339V229C578 220 537 203 480 180Z"/>
    </clipPath>
  </defs>

  <!-- Ambient backdrop -->
